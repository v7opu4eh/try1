name: DevOps CI/CD Pipeline

# Запускать пайплайн при каждом push или Pull Request в ветку main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ДЖОБ 1: Проверка и тестирование кода
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Чекаут кода из репозитория
        uses: actions/checkout@v4

      - name: Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Базовая проверка синтаксиса (Linter)
        run: |
          python -m py_compile main.py

  # ДЖОБ 2: Сборка и публикация Docker-образа
  build-and-push:
    needs: lint-and-test  # Запускается ТОЛЬКО после успешного прохождения первого джоба
    runs-on: ubuntu-latest

    steps:
      - name: Чекаут кода
        uses: actions/checkout@v4

      - name: Авторизация в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Сборка и push Docker-образа в Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-app:latest,${{ secrets.DOCKERHUB_USERNAME }}/devops-app:${{ github.sha }}
